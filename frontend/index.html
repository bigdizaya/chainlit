<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TAG INJECTION PLACEHOLDER -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FONT START -->
    <!-- BAYYAN « Encre & Or »: Geist (UI), Newsreader (answer text),
         Instrument Serif (display), Amiri (Arabic), IBM Plex Sans Arabic (Arabic UI) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700&family=Geist+Mono:wght@400..600&family=Geist:wght@300..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      rel="stylesheet"
    />
    <!-- Footed lining digits and a short hyphen for the display face -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&text=0123456789&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&text=-&display=swap"
      rel="stylesheet"
    />
    <!-- FONT END -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    />
    <!-- Pre-paint theme and locale: before the injected app JS, which reads
         html.dark / html.light for the browser theme-color at first paint -->
    <script>
      // Apply the saved theme before React paints to avoid a light flash in dark mode.
      (function () {
        try {
          var saved = window.localStorage.getItem('vite-ui-theme');
          var dark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (error) {
          // Storage can be unavailable in private WebViews: keep the light default.
        }
      })();
    </script>
    <script>
      // Apply the URL/saved/device locale before React paints to avoid a French/LTR flash.
      (function () {
        var supported = ['fr', 'ar', 'en', 'es'];
        var candidates = [];
        var requestedLocale = '';
        try {
          requestedLocale =
            new URL(window.location.href).searchParams.get('lang') || '';
          candidates.push(requestedLocale);
        } catch (error) {
          // Explicit URL locale remains optional in embedded WebViews.
        }
        try {
          candidates.push(localStorage.getItem('bayyan_locale') || '');
          candidates.push(localStorage.getItem('jawab_lang') || '');
        } catch (error) {
          // Storage can be unavailable in hardened or private WebViews.
        }
        try {
          candidates = candidates.concat(navigator.languages || []);
          candidates.push(navigator.language || '');
        } catch (error) {
          // French remains the deterministic fallback.
        }

        var locale = 'fr';
        for (var index = 0; index < candidates.length; index += 1) {
          var candidate = String(candidates[index] || '')
            .trim()
            .replace('_', '-')
            .split('-')[0]
            .toLowerCase();
          if (supported.indexOf(candidate) !== -1) {
            locale = candidate;
            break;
          }
        }

        document.documentElement.lang = locale;
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.dataset.bayyanLocale = locale;

        var normalizedRequest = String(requestedLocale || '')
          .trim()
          .replace('_', '-')
          .split('-')[0]
          .toLowerCase();
        if (supported.indexOf(normalizedRequest) !== -1) {
          var languageTags = {
            fr: 'fr-FR',
            ar: 'ar-SA',
            en: 'en-US',
            es: 'es'
          };
          try {
            localStorage.setItem(
              'bayyan_locale',
              languageTags[normalizedRequest]
            );
            localStorage.setItem('jawab_lang', normalizedRequest);
          } catch (error) {
            // URL language still applies to this document without persistence.
          }
        }
      })();
    </script>
    <!-- JS INJECTION PLACEHOLDER -->
    <!-- CSS INJECTION PLACEHOLDER -->
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        background: #faf7f1;
      }
      html.dark,
      html.dark body,
      html.dark #root {
        background: #0b0a08;
        color-scheme: dark;
      }
    </style>
    <script>
      const global = globalThis;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
