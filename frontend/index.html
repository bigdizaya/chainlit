<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TAG INJECTION PLACEHOLDER -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FONT START -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- FONT END -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    />
    <!-- JS INJECTION PLACEHOLDER -->
    <!-- CSS INJECTION PLACEHOLDER -->
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        background: #fafafa;
      }
    </style>
    <script>
      // Apply the saved/device locale before React paints to avoid a French/LTR flash.
      (function () {
        var supported = ['fr', 'ar', 'en', 'es'];
        var candidates = [];
        try {
          candidates.push(localStorage.getItem('bayyan_locale') || '');
          candidates.push(localStorage.getItem('jawab_lang') || '');
        } catch (error) {
          // Storage can be unavailable in hardened or private WebViews.
        }
        try {
          candidates.push(
            new URL(window.location.href).searchParams.get('lang') || ''
          );
        } catch (error) {
          // Explicit URL locale remains optional in embedded WebViews.
        }
        try {
          candidates = candidates.concat(navigator.languages || []);
          candidates.push(navigator.language || '');
        } catch (error) {
          // French remains the deterministic fallback.
        }

        var locale = 'fr';
        for (var index = 0; index < candidates.length; index += 1) {
          var candidate = String(candidates[index] || '')
            .trim()
            .replace('_', '-')
            .split('-')[0]
            .toLowerCase();
          if (supported.indexOf(candidate) !== -1) {
            locale = candidate;
            break;
          }
        }

        document.documentElement.lang = locale;
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.dataset.bayyanLocale = locale;
      })();
    </script>
    <script>
      const global = globalThis;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
